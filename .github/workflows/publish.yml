name: publish

# Releasing is a deliberate, tagged act — never someone's laptop running
# `npm publish`. See decisions/0009.md.
#
# To release: bump the versions in packages/*/package.json, update
# CHANGELOG.md and STATE.md in the same commit, then tag and push, e.g.:
#   git tag v1.2.2 && git push origin v1.2.2
#
# Requires an npm automation token in the repo secret NPM_TOKEN, with
# publish rights to the @tfrc scope.
#
# This is a deliberate first-publish bootstrap, not the long-term shape.
# Trusted publishing (OIDC) removes the need for NPM_TOKEN entirely, but it
# can only be configured per-package on npmjs.com AFTER a package exists —
# so token-based publishing has to happen once before OIDC can replace it.
# T026 published all three at 1.0.1 on 2026-08-31; migrating to OIDC is now
# in progress. See specs/002-product-consumption-contract/tasks.md T028
# for the exact migration steps and current status. NODE_AUTH_TOKEN stays
# wired below as a fallback until a release has been confirmed to succeed
# via OIDC alone — npm's CLI tries OIDC first and only falls back to the
# token if OIDC isn't configured, so leaving both in place is what makes
# this step of the migration safe to attempt.

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  id-token: write # npm provenance

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      # Article III: nothing is published that has not passed the contract
      # and boundary checks. A tag is not a licence to skip the gate.
      - run: node scripts/check-contract.js
      - run: node scripts/lint-boundaries.js
      - run: node scripts/test-verify-consumer.js

  publish:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # Trusted publishing (OIDC) requires npm >= 11.5.1, which ships
          # with Node >= 22.14 — Node 20's bundled npm 10.x cannot do OIDC
          # at all, silently falling back to NODE_AUTH_TOKEN instead. This
          # bump is a hard prerequisite for T028, not a routine update.
          node-version: "22.14.0"
          registry-url: "https://registry.npmjs.org"
      # Order matters: the two dialects depend on an exact foundation
      # version, so foundation must exist on the registry first.
      #
      # Each step checks whether its own version is already on the
      # registry before publishing. GitHub Actions retries ("Re-run failed
      # jobs") re-run the WHOLE job from its first step, not just the step
      # that failed — so without this check, any partial failure after the
      # first package succeeds (an interrupted publish, a per-package
      # setting that needed fixing, a transient registry error) becomes
      # unrecoverable without a version bump, because retrying re-fails on
      # the package that already succeeded before it ever reaches the one
      # that didn't. This happened publishing 1.0.1 of all three: a
      # publishing-access setting blocked product, and every retry re-hit
      # foundation's already-published version first. See
      # specs/002-product-consumption-contract/tasks.md T026's note.
      - name: Publish @tfrc/foundation
        working-directory: packages/foundation
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          if npm view "@tfrc/foundation@$PKG_VERSION" version >/dev/null 2>&1; then
            echo "@tfrc/foundation@$PKG_VERSION is already on the registry — skipping."
          else
            npm publish --provenance --access public
          fi
      - name: Publish @tfrc/marketing
        working-directory: packages/marketing
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          if npm view "@tfrc/marketing@$PKG_VERSION" version >/dev/null 2>&1; then
            echo "@tfrc/marketing@$PKG_VERSION is already on the registry — skipping."
          else
            npm publish --provenance --access public
          fi
      - name: Publish @tfrc/product
        working-directory: packages/product
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          if npm view "@tfrc/product@$PKG_VERSION" version >/dev/null 2>&1; then
            echo "@tfrc/product@$PKG_VERSION is already on the registry — skipping."
          else
            npm publish --provenance --access public
          fi
