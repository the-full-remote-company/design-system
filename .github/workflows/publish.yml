name: publish

# Releasing is a deliberate, tagged act — never someone's laptop running
# `npm publish`. See decisions/0009.md.
#
# To release: bump the versions in packages/*/package.json, update
# CHANGELOG.md and STATE.md in the same commit, then tag and push, e.g.:
#   git tag v1.2.7 && git push origin v1.2.7
#
# Publishes via npm trusted publishing (OIDC) — no repository secret at
# all. Each package's npmjs.com settings name this exact workflow
# (organization the-full-remote-company, repo design-system, workflow
# publish.yml) as its trusted publisher, and Publishing access is set to
# "Require two-factor authentication and disallow tokens" — so a token
# COULD NOT authenticate here even if one existed. This is the completed
# state of specs/002-product-consumption-contract/tasks.md T028; see that
# file and CHANGELOG.md's 1.2.3–1.2.7 entries for the migration's full
# history, including two CI-tooling failures (npm CLI version mismatches)
# that had nothing to do with OIDC itself.
#
# Trusted publishing requires npm >= 11.5.1. setup-node's node-version
# input controls only the Node BINARY, not the npm CLI version it
# bundles, so npm is pinned explicitly below rather than trusted to
# whatever a given Node version happens to ship with.

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  id-token: write # required for OIDC trusted publishing and provenance

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      # Article III: nothing is published that has not passed the contract
      # and boundary checks. A tag is not a licence to skip the gate.
      - run: node scripts/check-contract.js
      - run: node scripts/lint-boundaries.js
      - run: node scripts/test-verify-consumer.js

  publish:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.14.0"
          registry-url: "https://registry.npmjs.org"
      - name: Ensure npm supports trusted publishing (OIDC)
        run: |
          # Pinned exactly, not @latest: npm's engines requirements move
          # independently of Node's, and a floating @latest can outrun
          # whichever Node version is pinned above (this happened once —
          # see CHANGELOG's 1.2.5/1.2.6 entries). npm 11.5.1 is the
          # documented OIDC minimum; its own engines field
          # (^20.17.0 || >=22.9.0) is compatible with 22.14.0 above.
          npm install -g npm@11.5.1
          echo "node: $(node --version)"
          echo "npm:  $(npm --version)"
      # Order matters: the two dialects depend on an exact foundation
      # version, so foundation must exist on the registry first.
      #
      # Each step checks whether its own version is already on the
      # registry before publishing. GitHub Actions retries ("Re-run failed
      # jobs") re-run the WHOLE job from its first step, not just the step
      # that failed — so without this check, any partial failure after the
      # first package succeeds becomes unrecoverable without a version
      # bump, because retrying re-fails on the package that already
      # succeeded before it ever reaches the one that didn't. See
      # specs/002-product-consumption-contract/tasks.md T026's note for
      # the incident that made this necessary.
      - name: Publish @tfrc/foundation
        working-directory: packages/foundation
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          if npm view "@tfrc/foundation@$PKG_VERSION" version >/dev/null 2>&1; then
            echo "@tfrc/foundation@$PKG_VERSION is already on the registry — skipping."
          else
            npm publish --provenance --access public
          fi
      - name: Publish @tfrc/marketing
        working-directory: packages/marketing
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          if npm view "@tfrc/marketing@$PKG_VERSION" version >/dev/null 2>&1; then
            echo "@tfrc/marketing@$PKG_VERSION is already on the registry — skipping."
          else
            npm publish --provenance --access public
          fi
      - name: Publish @tfrc/product
        working-directory: packages/product
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          if npm view "@tfrc/product@$PKG_VERSION" version >/dev/null 2>&1; then
            echo "@tfrc/product@$PKG_VERSION is already on the registry — skipping."
          else
            npm publish --provenance --access public
          fi
